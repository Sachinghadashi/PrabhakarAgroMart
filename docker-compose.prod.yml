version: '3.8'

services:
  # Internal MySQL Database Service (Not exposed publicly)
  mysql:
    image: mysql:8.0
    container_name: pam_prod_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_secure_root_password}
      MYSQL_DATABASE: ${DATABASE_NAME:-prabhakar_agro_mart}
      MYSQL_USER: ${DATABASE_USER:-agro_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-prod_secure_user_password}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_network

  # Production Gunicorn Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pam_prod_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,pam_prod_backend}
      DATABASE_ENGINE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME:-prabhakar_agro_mart}
      DATABASE_USER: ${DATABASE_USER:-agro_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-prod_secure_user_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    volumes:
      - media_prod_data:/app/media
      - static_prod_data:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal_network

  # Customer Storefront (Nginx Alpine)
  customer-frontend:
    build:
      context: ./customer-frontend
      dockerfile: Dockerfile
    container_name: pam_prod_customer
    restart: always
    networks:
      - internal_network

  # Admin Operations Portal (Nginx Alpine)
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: pam_prod_admin
    restart: always
    networks:
      - internal_network

  # Production Edge Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: pam_prod_proxy
    restart: always
    ports:
      - "80:80"      # Customer Storefront
      - "8080:8080"  # Admin Portal
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_prod_data:/app/media:ro
      - static_prod_data:/app/staticfiles:ro
    depends_on:
      - backend
      - customer-frontend
      - admin-frontend
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  mysql_prod_data:
    name: pam_mysql_prod_volume
  media_prod_data:
    name: pam_media_prod_volume
  static_prod_data:
    name: pam_static_prod_volume
