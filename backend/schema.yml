        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - COD
          - RAZORPAY
        description: |-
          * `RAZORPAY` - Razorpay (UPI / Cards / NetBanking)
          * `COD` - Cash on Delivery (COD)
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - FAILED
          - PAID
          - PENDING
          - REFUNDED
        description: |-
          * `PENDING` - Pending
          * `PAID` - Paid
          * `FAILED` - Failed
          * `REFUNDED` - Refunded
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - DELIVERED
          - OUT_FOR_DELIVERY
          - PACKED
          - PENDING_PAYMENT
          - PROCESSING
          - REFUNDED
          - RETURNED
          - RETURN_REQUESTED
          - SHIPPED
        description: |-
          * `PENDING_PAYMENT` - Pending Payment
          * `CONFIRMED` - Confirmed
          * `PROCESSING` - Processing
          * `PACKED` - Packed
          * `SHIPPED` - Shipped
          * `OUT_FOR_DELIVERY` - Out for Delivery
          * `DELIVERED` - Delivered
          * `CANCELLED` - Cancelled
          * `RETURN_REQUESTED` - Return Requested
          * `RETURNED` - Returned
          * `REFUNDED` - Refunded
