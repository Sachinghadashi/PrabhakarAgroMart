name: CI/CD Pipeline - Prabhakar Agro Mart

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-32-characters-long!!
          DJANGO_DEBUG: "1"
          DATABASE_ENGINE: sqlite
        run: |
          pytest backend/tests -v

  frontend-customer-build:
    name: Customer Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: customer-frontend/package.json

      - name: Install Customer Frontend Packages
        working-directory: ./customer-frontend
        run: npm ci

      - name: Build Customer Frontend
        working-directory: ./customer-frontend
        run: npm run build

  frontend-admin-build:
    name: Admin Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: admin-frontend/package.json

      - name: Install Admin Frontend Packages
        working-directory: ./admin-frontend
        run: npm ci

      - name: Build Admin Frontend
        working-directory: ./admin-frontend
        run: npm run build

  docker-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-customer-build, frontend-admin-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
