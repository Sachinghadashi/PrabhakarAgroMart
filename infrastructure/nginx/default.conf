# Upstream backend and frontend services
upstream backend_api {
    server backend:8000;
}

upstream customer_app {
    server customer-frontend:80;
}

upstream admin_app {
    server admin-frontend:80;
}

# Customer Storefront Server (Port 80)
server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Backend REST API
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Media uploads
    location /media/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django Admin static
    location /static/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # Customer Frontend SPA
    location / {
        proxy_pass http://customer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Admin Operations Portal Server (Port 8080)
server {
    listen 8080;
    server_name localhost;

    client_max_body_size 25M;

    # Backend REST API for Admin
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Frontend SPA
    location / {
        proxy_pass http://admin_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
