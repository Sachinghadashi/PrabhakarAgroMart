version: '3.8'

services:
  # MySQL Database Service with Persistent Volume
  mysql:
    image: mysql:8.0
    container_name: pam_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: prabhakar_agro_mart
      MYSQL_USER: agro_user
      MYSQL_PASSWORD: agro_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Django Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pam_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: dev-django-secret-key-prabhakar-agro-mart-2026
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,pam_backend"
      DATABASE_ENGINE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: prabhakar_agro_mart
      DATABASE_USER: agro_user
      DATABASE_PASSWORD: agro_dev_password
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:80,http://localhost:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:80,http://localhost:8080"
      RAZORPAY_KEY_ID: rzp_test_placeholder_key_id
      RAZORPAY_KEY_SECRET: placeholder_razorpay_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook_secret
      FRONTEND_URL: "http://localhost:5173"
      ADMIN_URL: "http://localhost:5174"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # Customer E-Commerce Storefront
  customer-frontend:
    build:
      context: ./customer-frontend
      dockerfile: Dockerfile
    container_name: pam_customer_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Admin Operations Portal
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: pam_admin_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    name: pam_mysql_volume
  media_data:
    name: pam_media_volume
